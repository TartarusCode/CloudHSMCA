name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # No lock file is tracked, so nothing pins the provider set. The weekly run
  # resolves `hashicorp/aws` fresh (TF_CLI_ARGS_init below) and fails if a new
  # provider release breaks the module.
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TF_VERSION: "1.9.8"
  TFLINT_VERSION: "v0.53.0"
  ACTIONLINT_VERSION: "1.7.7"
  MODULE: "."

  # One provider cache for every configuration. `make init` populates it once,
  # so the providers are downloaded and stored a single time instead of once per
  # directory, and the cache action carries it between runs. The dependency lock
  # file is not tracked (see .gitignore), so the cache may resolve without
  # pinning package hashes into one.
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
  TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "true"

  # A cache hit hands back provider versions that already satisfy the ranges in
  # versions.tf, so without this the weekly run would test the same versions as
  # the last pull request. -upgrade makes it ask the registry for the newest.
  TF_CLI_ARGS_init: ${{ github.event_name == 'schedule' && '-upgrade' || '' }}

jobs:
  terraform:
    name: fmt, validate, examples
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-terraform-env
        with:
          terraform-version: ${{ env.TF_VERSION }}

      - name: gates (one init, then the independent checks in parallel)
        run: make -j4 fmt-check validate examples

      - name: summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # init just wrote this even though it is never committed; that is where
          # the resolved provider version lives.
          aws_version=$(
            awk '/provider "registry\.terraform\.io\/hashicorp\/aws"/{seen=1}
                 seen && /^[[:space:]]*version[[:space:]]*=/ {print $3; exit}' \
              .terraform.lock.hcl 2>/dev/null | tr -d '"'
          )
          set -- modules/*/ examples/*/
          configs=$(( $# + 1 ))
          {
            echo "### Terraform validation"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| terraform | \`${TF_VERSION}\` |"
            echo "| hashicorp/aws | \`${aws_version:-unknown}\` |"
            echo "| configurations | ${configs} |"
            echo "| triggered by | \`${GITHUB_EVENT_NAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  tflint:
    name: tflint
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      # `tflint --init` fetches the aws ruleset named in .tflint.hcl; keying on
      # that file means a version bump re-downloads and nothing else does.
      - name: tflint plugin cache
        uses: actions/cache@v6
        with:
          path: ~/.tflint.d/plugins
          key: tflint-plugins-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}
          restore-keys: |
            tflint-plugins-${{ runner.os }}-

      - name: tflint
        run: make lint

  tests:
    name: offline harnesses
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The harnesses run `terraform console`, so they need providers, not just
      # the CLI: run-init keeps its default of "true".
      - uses: ./.github/actions/setup-terraform-env
        with:
          terraform-version: ${{ env.TF_VERSION }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # cryptography and boto3 are unpinned on purpose (CI is the drift check),
      # so the key follows the files that import them: a harness change is what
      # should invalidate the wheel cache.
      - name: python wheel cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: py-wheels-${{ runner.os }}-${{ hashFiles('modules/**/run.sh', 'modules/**/test_*.py') }}
          restore-keys: |
            py-wheels-${{ runner.os }}-

      - name: python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42" "boto3>=1.34"

      - name: compile python
        run: |
          python -m compileall -q tests modules/hsm-ca/scripts modules/roles-anywhere modules/alb-mtls

      - name: syntax check the shell tools
        run: |
          for f in modules/hsm-ca/scripts/*.sh.tftpl modules/hsm-ca/scripts/*.sh \
                   scripts/*.sh modules/*/tests/*.sh modules/*/tests/*/*.sh \
                   tests/*.sh tests/*/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done

      # The harnesses need providers (`terraform console` renders the OpenSSL
      # profiles and the ceremony script), so `test` depends on `init`.
      - name: offline harnesses (seven harnesses, one suite)
        shell: bash
        run: make test 2>&1 | tee "$RUNNER_TEMP/harnesses.log"

      - name: summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          passed=$(grep -cE '^-- .*: PASS$' "$RUNNER_TEMP/harnesses.log" || true)
          {
            echo "### Offline harnesses"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| suites passed | ${passed} |"
            echo "| python | \`$(python --version 2>&1 | awk '{print $2}')\` |"
            echo "| triggered by | \`${GITHUB_EVENT_NAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  hygiene:
    name: repository hygiene
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install actionlint
        shell: bash
        run: |
          set -euo pipefail
          dir=/usr/local/bin
          if [ ! -w "$dir" ]; then
            dir="$HOME/.local/bin"
            mkdir -p "$dir"
            echo "$dir" >> "$GITHUB_PATH"
          fi
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
            "$ACTIONLINT_VERSION" "$dir"
          "$dir/actionlint" --version

      - name: workflow and action lint
        shell: bash
        run: make workflow-lint

      - name: no private key material
        run: |
          set -euo pipefail
          # The whole point of this repository is that keys never exist in a
          # file. Fail if one is ever committed (docs are excluded: they quote
          # the PEM armour in prose).
          if git grep -nIE 'BEGIN ([A-Z]+ )?PRIVATE KEY' -- . ':!*.md' ':!LICENSE'; then
            echo "::error::private key material committed to the repository"
            exit 1
          fi

      - name: no state, plan or tfvars files tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(tfstate|tfplan|tfvars|pem|key|csr)$'; then
            echo "::error::generated or secret material must not be tracked"
            exit 1
          fi

      - name: no dependency lock file tracked
        run: |
          set -euo pipefail
          # This is a reusable module, so providers resolve against versions.tf.
          # A committed lock file pins one platform's package hashes and then
          # fails on another OS/arch, or freezes CI on a stale provider set.
          if git ls-files | grep -E '(^|/)\.terraform\.lock\.hcl$'; then
            echo "::error::.terraform.lock.hcl must not be tracked"
            exit 1
          fi

      - name: the provider cache is not tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -q '^.terraform-plugin-cache/'; then
            echo "::error::the shared provider cache must stay out of the repository"
            exit 1
          fi
