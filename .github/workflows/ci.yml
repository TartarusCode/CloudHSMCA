name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TFLINT_VERSION: "v0.53.0"
  MODULE: "."

  # One provider cache for every configuration. `make init` populates it once,
  # so the providers are downloaded and stored a single time per lock file
  # instead of once per directory, and the cache action below carries it
  # between runs.
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  terraform:
    name: fmt, validate, examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ env.TF_VERSION }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            tf-providers-${{ runner.os }}-${{ env.TF_VERSION }}-

      - name: gates (one init, then the independent checks in parallel)
        run: make -j4 fmt-check validate examples

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        run: make lint

  tests:
    name: offline harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ env.TF_VERSION }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            tf-providers-${{ runner.os }}-${{ env.TF_VERSION }}-

      - name: python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42" "boto3>=1.34"

      - name: compile python
        run: |
          python -m compileall -q tests scripts

      - name: syntax check the shell tools
        run: |
          for f in scripts/*.sh.tftpl scripts/*.sh tests/*.sh tests/*/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done

      # The harnesses need providers (`terraform console` renders the OpenSSL
      # profiles and the ceremony script), so `test` depends on `init`.
      - name: offline harnesses (five harnesses, one suite)
        run: make test

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: no private key material
        run: |
          set -euo pipefail
          # The whole point of this repository is that keys never exist in a
          # file. Fail if one is ever committed (docs are excluded: they quote
          # the PEM armour in prose).
          if git grep -nIE 'BEGIN ([A-Z]+ )?PRIVATE KEY' -- . ':!*.md' ':!LICENSE'; then
            echo "::error::private key material committed to the repository"
            exit 1
          fi

      - name: no state, plan or tfvars files tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(tfstate|tfplan|tfvars|pem|key|csr)$'; then
            echo "::error::generated or secret material must not be tracked"
            exit 1
          fi

      - name: the provider cache is not tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -q '^.terraform-plugin-cache/'; then
            echo "::error::the shared provider cache must stay out of the repository"
            exit 1
          fi
