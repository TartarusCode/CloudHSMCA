name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TFLINT_VERSION: "v0.53.0"
  MODULE: terraform-aws-rolesanywhere-hsm-ca

jobs:
  terraform:
    name: fmt, validate, examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -recursive -check -diff

      - name: terraform validate
        run: |
          terraform -chdir="$MODULE" init -backend=false -input=false -no-color
          terraform -chdir="$MODULE" validate -no-color

      - name: terraform validate examples
        run: |
          set -euo pipefail
          for f in examples/*/main.tf; do
            dir="$(dirname "$f")"
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact

  tests:
    name: offline harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42" "boto3>=1.34"

      - name: compile python
        run: |
          python -m compileall -q "$MODULE/scripts" "$MODULE/tests"

      - name: python syntax check the shell tools
        run: |
          for f in "$MODULE"/scripts/*.sh.tftpl "$MODULE"/tests/*.sh "$MODULE"/tests/*/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done

      - name: offline harnesses
        run: bash "$MODULE/tests/run-all.sh"

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: no private key material
        run: |
          set -euo pipefail
          # The whole point of this repository is that keys never exist in a
          # file. Fail if one is ever committed (docs are excluded: they quote
          # the PEM armour in prose).
          if git grep -nIE 'BEGIN ([A-Z]+ )?PRIVATE KEY' -- . ':!*.md' ':!LICENSE'; then
            echo "::error::private key material committed to the repository"
            exit 1
          fi

      - name: no state, plan or tfvars files tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(tfstate|tfplan|tfvars|pem|key|csr)$'; then
            echo "::error::generated or secret material must not be tracked"
            exit 1
          fi
